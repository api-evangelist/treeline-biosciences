aid: treeline-biosciences
name: Treeline Biosciences
description: 'Treeline Biosciences is a drug discovery and development company that
  aspires to make great medicines reliably and repeatedly, matching compelling disease
  targets with clinically proven drug approaches -- small-molecule inhibitors, protein
  degraders, and antibody drug conjugates -- enabled in-house at its U.S. and EU research
  facilities and integrated with in silico and machine learning models that help its
  scientists understand protein targets at an atomic level. The company pursues a
  target-centric preclinical pipeline serving patients with serious diseases across
  oncology, immunology, and neurology, and is a portfolio company of GV. Treeline
  publishes no public developer or API surface.'
